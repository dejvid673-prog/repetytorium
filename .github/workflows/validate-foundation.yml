name: Validate foundation

on:
  pull_request:
  push:
    branches:
      - "agent/repository-foundation"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact repository commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/tarball/${COMMIT_SHA}" \
            --output repository.tar.gz
          mkdir repository
          tar --extract --gzip --file repository.tar.gz --directory repository --strip-components=1
      - name: Run dependency-free validator
        working-directory: repository
        run: python3 scripts/validate_foundation.py
