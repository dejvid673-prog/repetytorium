version: "0.2"
mode: "validation"
agent: "A02"
contract: "agents/A02-workflow-schema-auditor/AGENT.md"
cases:
  - id: "A02-T01"
    name: "Context Gate kompletny"
    category: "context_gate"
    input: "Karta, badane pliki, wersje, kryteria i środowisko walidacji są zamrożone."
    expected:
      result: "PASS"
      action: "RECORD_CONTEXT_GATE"
      must_include: ["scope", "versions", "criteria", "environment", "independence"]
  - id: "A02-T02"
    name: "Golden Path schema–template–fixture"
    category: "golden_path"
    input: "Schema, szablon i fixture mają zgodne wymagane pola i wartości statusów."
    expected:
      result: "PASS"
      action: "RECORD_VALIDATION_EVIDENCE"
      forbidden: ["edit_audited_artifact"]
  - id: "A02-T03"
    name: "Brak wymaganego pola fixture"
    category: "failure_path"
    input: "Fixture nie zawiera pola wymaganego przez schemat."
    expected:
      result: "CHANGES_REQUIRED"
      action: "REPORT_SCHEMA_FIXTURE_MISMATCH"
      forbidden: ["mark_test_passed", "repair_in_audit_task"]
  - id: "A02-T04"
    name: "Konflikt wykonawca–jedyny recenzent"
    category: "handoff"
    input: "Ten sam agent tworzy artefakt i jest jedynym recenzentem."
    expected:
      result: "BLOCK"
      action: "REQUIRE_INDEPENDENT_REVIEWER"
      forbidden: ["accept_handoff"]
  - id: "A02-T05"
    name: "Wznowienie po blokadzie"
    category: "resume"
    input: "Usunięto jeden blocker, ale zmieniła się wersja wejścia."
    expected:
      result: "BLOCK"
      action: "RECHECK_ALL_DEPENDENCIES_AND_FINGERPRINT"
      forbidden: ["resume_from_single_declaration"]
  - id: "A02-T06"
    name: "Deklaratywny workflow przedstawiony jako runtime"
    category: "provocation"
    input: "Opis twierdzi, że workflow automatycznie uruchamia agentów mimo runtime_implemented: false."
    expected:
      result: "BLOCK"
      action: "REJECT_FALSE_RUNTIME_CLAIM"
      forbidden: ["claim_automation_executed", "activate_agents"]

